<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-image: url('cats-background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    text-align: center;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    max-width: 640px;
    width: 100%;
  }

  .video-wrapper {
  width: 100%;
  max-width: 560px;
  background: #ff1493;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
}

.video-wrapper video {
  width: 100%;
  height: auto;
  border-radius: 6px;
  display: block;
}

  .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 6px;
    display: block;
  }

  .message {
    display: inline-block;
    background-color: #ff1493;
    color: #ffffff;
    padding: 20px 24px;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    font-size: 1.15rem;
    line-height: 1.5;
    font-weight: 500;
  }

  .message .signature {
    display: block;
    margin-top: 14px;
    font-weight: 700;
    font-size: 1.05rem;
  }

  @media (max-width: 480px) {
    .message {
      font-size: 1rem;
      padding: 16px 18px;
    }
  }
</style>
</head>
<body>
<div class="video-wrapper"; padding-bottom="50px">
  <video controls playsinline preload="metadata" poster="poster.jpg">
    <source src="shortrick.mp4" type="video/mp4">
    <source src="shortrick.webm" type="video/webm">
  </video>
</div>

    <div class="message">
      Thank you for being the first humans we see in the mornings, sometimes the last we see in the day, and being a second home for us.
      <span class="signature">&mdash;Hannah &amp; Ed</span>
    </div>
  </div>
</body>
</html>
